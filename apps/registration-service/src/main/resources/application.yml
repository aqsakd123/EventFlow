server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: registration-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventflow?currentSchema=registration_service}
    username: ${SPRING_DATASOURCE_USERNAME:eventflow}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 2000
  flyway:
    enabled: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:registration_service}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:registration_service}
    create-schemas: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:eventflow-analytics}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eventflow:
  reconciliation:
    enabled: ${EVENT_RECONCILIATION_ENABLED:false}
    auto: ${EVENT_RECONCILIATION_AUTO:false}
    chaos-writes-enabled: ${EVENT_RECONCILIATION_CHAOS_WRITES_ENABLED:false}
    site-id: ${EVENT_RECONCILIATION_SITE_ID:registration}
    poll-ms: ${EVENT_RECONCILIATION_POLL_MS:5000}
    internal-key: ${EVENT_RECONCILIATION_INTERNAL_KEY:}
  event-service:
    url: ${EVENT_SERVICE_URL:http://localhost:8081}
  kafka:
    topic: ${KAFKA_TOPIC:eventflow.domain-events}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:1000}
  metrics:
    refresh-ms: ${METRICS_REFRESH_MS:5000}
    kafka-lag-refresh-ms: ${KAFKA_LAG_REFRESH_MS:5000}
    outbox-alert-age-seconds: ${OUTBOX_ALERT_AGE_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: '%5p [trace=%X{trace_id} correlation=%X{correlation_id}]'
